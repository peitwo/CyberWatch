# CyberWatch Alembic configuration
#
# NOTE: this file is intentionally ASCII-only. Alembic reads it with the
# platform default encoding; on Chinese Windows that is GBK, which would
# break on any non-ASCII byte. Chinese explanations live in migrations/env.py
# and docs/V0.4.1-*.md instead.
#
# IMPORTANT: sqlalchemy.url is deliberately left EMPTY.
#
# The database URL is injected by migrations/env.py through
# app/config.py::resolve_database_url(), with this priority:
#   1. sqlalchemy.url explicitly set by the caller (tests / programmatic use)
#   2. environment variable CYBERWATCH_DATABASE_URL
#   3. <project root>/cyberwatch.db (absolute path)
#
# Putting a second copy of the URL here would create a second source of truth,
# and a mismatch would silently make the app and the migration target two
# different databases.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
